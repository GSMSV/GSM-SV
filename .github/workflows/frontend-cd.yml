name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp "${{ secrets.DEPLOY_ENV_PATH }}" .env

      - name: Build frontend image
        run: docker compose build frontend

      - name: Restart frontend container
        run: docker compose up -d --no-deps frontend

      - name: Verify frontend status
        run: |
          sleep 5
          docker compose ps frontend
          docker compose ps frontend | grep -q "Up" || { docker compose logs frontend --tail=50; exit 1; }
