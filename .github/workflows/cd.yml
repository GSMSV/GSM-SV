name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Changed Areas
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      serverless: ${{ steps.changes.outputs.serverless }}
      global: ${{ steps.changes.outputs.global }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Analyze changed files
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # backend/** 또는 backend-cd 워크플로우 자체가 변경됐는지 확인
          if echo "$CHANGED" | grep -qE '^backend/|^\.github/workflows/cd\.yml$'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # frontend/** 또는 frontend-cd 워크플로우 자체가 변경됐는지 확인
          if echo "$CHANGED" | grep -qE '^frontend/|^\.github/workflows/cd\.yml$'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # serverless/** 또는 cd 워크플로우 자체가 변경됐는지 확인
          if echo "$CHANGED" | grep -qE '^serverless/|^\.github/workflows/cd\.yml$'; then
            echo "serverless=true" >> "$GITHUB_OUTPUT"
          else
            echo "serverless=false" >> "$GITHUB_OUTPUT"
          fi

          # global 트리거 대상 파일이 변경됐는지 확인
          # (backend/frontend/serverless 외의 실질적인 파일 변경 = docker-compose, nginx, .env 등)
          GLOBAL=$(echo "$CHANGED" \
            | grep -vE '^(backend|frontend|serverless|\.agents|\.claude|\.codex)/' \
            | grep -v '\.md$' \
            | grep -v '^\.gitignore$' \
            | grep -v '^\.github/workflows/cd\.yml$')
          if [ -n "$GLOBAL" ]; then
            echo "global=true" >> "$GITHUB_OUTPUT"
          else
            echo "global=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    name: Deploy Backend
    needs: detect
    # global 파일이 함께 변경됐으면 deploy-all이 담당하므로 skip
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.global == 'false'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp "${{ secrets.DEPLOY_ENV_PATH }}" .env

      - name: Build backend image
        run: docker compose build backend

      - name: Restart backend container
        run: docker compose up -d --no-deps backend

      - name: Verify backend status
        run: |
          MAX=12
          for i in $(seq 1 $MAX); do
            echo "Waiting for backend... ($i/$MAX)"
            if docker compose ps backend | grep -q "Up"; then
              echo "backend is Up."
              docker compose ps backend
              exit 0
            fi
            if [ "$i" -eq "$MAX" ]; then
              echo "Timeout: backend did not become healthy within $((MAX * 5)) seconds."
              docker compose logs backend --tail=50
              exit 1
            fi
            sleep 5
          done

  deploy-frontend:
    name: Deploy Frontend
    needs: detect
    # global 파일이 함께 변경됐으면 deploy-all이 담당하므로 skip
    if: needs.detect.outputs.frontend == 'true' && needs.detect.outputs.global == 'false'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp "${{ secrets.DEPLOY_ENV_PATH }}" .env

      - name: Build frontend image
        run: docker compose build frontend

      - name: Restart frontend container
        run: docker compose up -d --no-deps frontend

      - name: Verify frontend status
        run: |
          MAX=12
          for i in $(seq 1 $MAX); do
            echo "Waiting for frontend... ($i/$MAX)"
            if docker compose ps frontend | grep -q "Up"; then
              echo "frontend is Up."
              docker compose ps frontend
              exit 0
            fi
            if [ "$i" -eq "$MAX" ]; then
              echo "Timeout: frontend did not become healthy within $((MAX * 5)) seconds."
              docker compose logs frontend --tail=50
              exit 1
            fi
            sleep 5
          done

  deploy-serverless:
    name: Deploy Serverless
    needs: detect
    # global 파일이 함께 변경됐으면 deploy-all이 담당하므로 skip
    if: needs.detect.outputs.serverless == 'true' && needs.detect.outputs.global == 'false'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp "${{ secrets.DEPLOY_ENV_PATH }}" .env

      - name: Build serverless image
        run: docker compose build serverless

      - name: Restart serverless container
        run: docker compose up -d --no-deps serverless

      - name: Verify serverless status
        run: |
          MAX=12
          for i in $(seq 1 $MAX); do
            echo "Waiting for serverless... ($i/$MAX)"
            if docker compose ps serverless | grep -q "Up"; then
              echo "serverless is Up."
              docker compose ps serverless
              exit 0
            fi
            if [ "$i" -eq "$MAX" ]; then
              echo "Timeout: serverless did not become healthy within $((MAX * 5)) seconds."
              docker compose logs serverless --tail=50
              exit 1
            fi
            sleep 5
          done

  deploy-all:
    name: Deploy All Services
    needs: detect
    if: needs.detect.outputs.global == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp "${{ secrets.DEPLOY_ENV_PATH }}" .env

      - name: Build all images
        run: docker compose build

      - name: Restart all containers
        run: docker compose up -d

      - name: Verify all services status
        run: |
          MAX=12
          for i in $(seq 1 $MAX); do
            echo "Waiting for all services... ($i/$MAX)"
            PS_OUTPUT=$(docker compose ps)
            echo "$PS_OUTPUT"

            if echo "$PS_OUTPUT" | grep -qE "Exit|Restarting"; then
              echo "Detected failed container. Dumping logs."
              docker compose logs --tail=50
              exit 1
            fi

            TOTAL=$(docker compose ps --services | wc -l | tr -d ' ')
            UP_COUNT=$(echo "$PS_OUTPUT" | grep -c "Up" || true)
            if [ "$UP_COUNT" -ge "$TOTAL" ]; then
              echo "All $TOTAL services are Up."
              exit 0
            fi

            if [ "$i" -eq "$MAX" ]; then
              echo "Timeout: not all services became healthy within $((MAX * 5)) seconds."
              docker compose logs --tail=50
              exit 1
            fi
            sleep 5
          done
