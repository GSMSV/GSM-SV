services:
  db:
    image: postgres:16-alpine
    restart: always
    command: postgres -c log_connections=on -c log_disconnections=on
    environment:
      POSTGRES_USER: gsmsv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gsmsv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsmsv"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gsmsv:${DB_PASSWORD}@db:5432/gsmsv
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DISCORD_URL: ${NEXT_PUBLIC_DISCORD_URL}
        NEXT_PUBLIC_API_URL: http://backend:8000
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  uploads:
  backups:
