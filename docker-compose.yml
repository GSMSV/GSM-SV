services:
  db:
    image: postgres:16-alpine
    restart: always
    command: postgres -c log_connections=on -c log_disconnections=on
    environment:
      POSTGRES_USER: gsmsv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gsmsv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsmsv"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal-net
      - serverless-net

  backend:
    build:
      context: ./backend
      network: host
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gsmsv}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-gsmsv}
      SERVERLESS_SERVICE_URL: http://serverless:3001
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal-net
      - serverless-net

  serverless:
    build:
      context: ./serverless
      network: host
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gsmsv}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-gsmsv}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - serverless-net

volumes:
  pgdata:
  uploads:
  backups:

networks:
  internal-net:
  serverless-net:
